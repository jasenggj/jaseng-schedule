<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 캐시 방지 메타 태그 추가 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>광주자생한방병원 의료진 진료일정 DID</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        * { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { margin: 0; padding: 0; background-color: #f1f5f9; color: #1e293b; overflow: hidden; user-select: none; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #did-canvas { width: 1920px; height: 1080px; background-color: #f8fafc; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .doctor-card { background: #ffffff; border-radius: 18px; border: 1px solid #cbd5e1; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08); display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 12px; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="did-canvas">
        <header class="h-[90px] bg-gradient-to-r from-blue-700 via-blue-600 to-indigo-600 text-white px-8 flex items-center justify-between border-b-4 border-amber-400 shadow-md flex-shrink-0 relative">
            <div class="flex-1"></div>
            <div onclick="handleSecretTitleClick()" title="관리자 진입" class="cursor-pointer select-none text-center flex-1">
                <h1 class="text-4xl font-black tracking-wider leading-none text-white whitespace-nowrap drop-shadow-sm">광주자생한방병원 의료진 진료일정</h1>
            </div>
            <div class="flex-1 flex justify-end">
                <div class="flex items-center gap-3 bg-white/95 px-4 py-2 rounded-xl border border-blue-200/80 text-xs font-bold text-slate-800 shadow-sm">
                    <span class="flex items-center gap-1"><span class="text-blue-600 text-lg leading-none">●</span> 진료</span>
                    <span class="flex items-center gap-1"><span class="text-rose-500 text-lg leading-none">★</span> 야간/연장진료</span>
                    <span class="flex items-center gap-1"><span class="text-emerald-500 text-lg leading-none">▲</span> 부분진료</span>
                    <span class="flex items-center gap-1 text-slate-400"><span class="text-slate-400 text-lg leading-none">-</span> 휴진</span>
                </div>
            </div>
        </header>

        <main class="grid grid-cols-5 grid-rows-2 gap-3.5 p-4 flex-grow h-[calc(1080px-90px-35px)]"></main>

        <footer class="h-[35px] bg-slate-100 border-t border-slate-200 px-8 flex items-center justify-between text-xs font-bold text-slate-600 flex-shrink-0">
            <span><i class="fa-solid fa-circle-info text-blue-600 mr-1.5"></i> 진료시간표는 병원 사정에 따라 변경될 수 있습니다. 사전 예약 후 내원하시면 대기 시간을 줄이실 수 있습니다.</span>
            <span class="font-black text-slate-700">문의전화: <strong class="text-rose-600 text-sm">1577-0007</strong></span>
        </footer>
    </div>

    <!-- Admin Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden border border-slate-200">
            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between flex-shrink-0">
                <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-user-shield text-amber-400"></i> 관리자 설정</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            <div class="bg-slate-100 px-6 py-2.5 border-b border-slate-200 flex items-center justify-between text-xs font-bold text-slate-700">
                <span class="flex items-center gap-2"><i class="fa-solid fa-file-csv text-emerald-600 text-base"></i> 수정 후 <b>[CSV 다운로드]</b>하여 GitHub에 덮어씌워주세요.</span>
                <div class="flex items-center gap-2">
                    <button onclick="exportToCSV()" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-sm">CSV 다운로드</button>
                    <button onclick="document.getElementById('csvFileInput').click()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-sm">CSV 불러오기</button>
                    <input type="file" id="csvFileInput" accept=".csv" onchange="importFromCSV(event)" class="hidden">
                </div>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar flex-grow space-y-6" id="modalDoctorList"></div>
            <div class="bg-slate-100 px-6 py-4 flex items-center justify-between border-t border-slate-200 flex-shrink-0">
                <button onclick="showResetConfirm()" class="text-rose-600 font-bold text-sm">초기 설정으로 복원</button>
                <div class="flex items-center gap-3">
                    <button onclick="closeModal()" class="px-5 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-sm">취소</button>
                    <button onclick="saveChanges()" class="px-6 py-2.5 bg-blue-700 text-white font-bold rounded-xl shadow text-sm">임시 저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="resetConfirmModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full border border-slate-200 text-center space-y-4">
            <h3 class="text-lg font-bold">초기화 진행하시겠습니까?</h3>
            <div class="flex justify-center gap-3"><button onclick="closeResetConfirm()" class="px-4 py-2 bg-slate-200">취소</button><button onclick="executeResetDefaults()" class="px-5 py-2 bg-rose-600 text-white">확인</button></div>
        </div>
    </div>

    <script>
        const days = [
            { key: 'mon', label: '월' }, { key: 'tue', label: '화' },
            { key: 'wed', label: '수' }, { key: 'thu', label: '목' },
            { key: 'fri', label: '금' }, { key: 'sat', label: '토' },
            { key: 'sun', label: '일' }
        ];

        const defaultDoctors = [
    { id: 1, name: "염승철", title: "병원장", dept: "침구의학과 전문의", photo: "images/doctor1.webp", schedule: { mon:['진료','진료'], tue:['진료','진료'], wed:['휴진','진료'], thu:['휴진','휴진'], fri:['진료','진료'], sat:['진료','진료'], sun:['휴진','휴진'] } },
    { id: 2, name: "김준수", title: "의무원장", dept: "재활의학과 전문의", photo: "images/doctor2.webp", schedule: { mon:['진료','진료'], tue:['휴진','휴진'], wed:['휴진','휴진'], thu:['진료','진료'], fri:['진료','진료'], sat:['진료','진료'], sun:['휴진','휴진'] } },
    { id: 3, name: "장영우", title: "원장", dept: "안이비인후피부과 전문의", photo: "images/doctor3.webp", schedule: { mon:['진료','진료'], tue:['휴진','휴진'], wed:['진료','진료'], thu:['부분','야간'], fri:['진료','진료'], sat:['진료','부분'], sun:['휴진','휴진'] } },
    { id: 4, name: "이일석", title: "원장", dept: "내과 전문의", photo: "images/doctor4.webp", schedule: { mon:['부분','야간'], tue:['진료','진료'], wed:['진료','진료'], thu:['휴진','휴진'], fri:['진료','진료'], sat:['진료','휴진'], sun:['휴진','휴진'] } },
    { id: 5, name: "김동은", title: "원장", dept: "재활의학과 전문의", photo: "images/doctor5.webp", schedule: { mon:['진료','진료'], tue:['부분','야간'], wed:['휴진','휴진'], thu:['진료','진료'], fri:['진료','진료'], sat:['진료','진료'], sun:['휴진','휴진'] } },
    { id: 6, name: "이동근", title: "원장", dept: "침구의학과 전문의", photo: "images/doctor6.webp", schedule: { mon:['진료','진료'], tue:['휴진','휴진'], wed:['진료','진료'], thu:['진료','진료'], fri:['부분','야간'], sat:['휴진','휴진'], sun:['휴진','휴진'] } },
    { id: 7, name: "강경래", title: "원장", dept: "내과 전문의", photo: "images/doctor7.webp", schedule: { mon:['진료','진료'], tue:['진료','진료'], wed:['휴진','휴진'], thu:['진료','진료'], fri:['진료','진료'], sat:['진료','진료'], sun:['휴진','휴진'] } },
    { id: 8, name: "이영식", title: "원장", dept: "신경정신과 전문의", photo: "images/doctor8.webp", schedule: { mon:['진료','진료'], tue:['휴진','휴진'], wed:['진료','진료'], thu:['진료','진료'], fri:['진료','진료'], sat:['진료','진료'], sun:['휴진','휴진'] } },
    { id: 9, name: "박주헌", title: "원장", dept: "침구의학과 전문의", photo: "images/doctor9.webp", schedule: { mon:['진료','진료'], tue:['휴진','휴진'], wed:['진료','진료'], thu:['휴진','휴진'], fri:['진료','진료'], sat:['진료','진료'], sun:['휴진','휴진'] } },
    { id: 10, name: "고민석", title: "원장", dept: "침구의학과", photo: "images/doctor10.webp", schedule: { mon:['휴진','휴진'], tue:['휴진','휴진'], wed:['휴진','휴진'], thu:['진료','진료'], fri:['진료','부분'], sat:['휴진','휴진'], sun:['진료','진료'] } }
];

        let doctors = [];

        function normalizeStatus(val) {
            if (!val) return '휴진';
            const clean = val.toString().trim();
            if (clean === '1' || clean === '진료' || clean === 'jinryo') return '진료';
            if (clean === '2' || clean === '야간' || clean === 'yagan') return '야간';
            if (clean === '3' || clean === '부분' || clean === 'bubuon') return '부분';
            return '휴진';
        }

        // ⭐ 핵심 수정 부분: 깃허브 절대 주소 사용 + 매직인포 캐시 완벽 무력화
        async function loadRemoteCSV() {
            try {
                const absoluteUrl = 'https://jasenggj.github.io/jaseng-schedule/schedule.csv?nocache=' + new Date().getTime();
                const response = await fetch(absoluteUrl, {
                    method: 'GET',
                    headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' },
                    cache: 'no-store'
                });
                
                if (!response.ok) return false;
                const text = await response.text();
                return parseAndApplyCSV(text);
            } catch (e) {
                return false;
            }
        }

        function parseAndApplyCSV(text) {
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
            if (lines.length <= 1) return false;

            const newDoctors = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                if (cols.length >= 17) {
                    const clean = cols.map(c => c.replace(/^"|"$/g, '').trim());
                    newDoctors.push({
                        id: parseInt(clean[0]) || (i),
                        name: clean[1], title: clean[2], dept: clean[3], photo: clean[4] || `images/doctor${i}.webp`,
                        schedule: {
                            mon: [normalizeStatus(clean[5]), normalizeStatus(clean[6])],
                            tue: [normalizeStatus(clean[7]), normalizeStatus(clean[8])],
                            wed: [normalizeStatus(clean[9]), normalizeStatus(clean[10])],
                            thu: [normalizeStatus(clean[11]), normalizeStatus(clean[12])],
                            fri: [normalizeStatus(clean[13]), normalizeStatus(clean[14])],
                            sat: [normalizeStatus(clean[15]), normalizeStatus(clean[16])],
                            sun: [normalizeStatus(clean[17]), normalizeStatus(clean[18])]
                        }
                    });
                }
            }
            if (newDoctors.length > 0) {
                doctors = newDoctors;
                return true;
            }
            return false;
        }

        async function initData() {
            const loadedCSV = await loadRemoteCSV();
            if (!loadedCSV) {
                try {
                    const saved = localStorage.getItem('jaseng_did_doctors_v14');
                    doctors = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultDoctors));
                } catch (e) { doctors = JSON.parse(JSON.stringify(defaultDoctors)); }
            }
            renderDID();
        }

        function renderStatusBadge(status) {
            const norm = normalizeStatus(status);
            switch(norm) {
                case '진료': return `<span class="text-blue-600 font-black text-xl leading-none">●</span>`;
                case '야간': return `<span class="text-rose-500 font-black text-xl leading-none">★</span>`;
                case '부분': return `<span class="text-emerald-500 font-black text-xl leading-none">▲</span>`;
                default: return `<span class="text-slate-300 font-black text-lg leading-none">-</span>`;
            }
        }

        function renderDID() {
            const main = document.querySelector('main');
            main.innerHTML = '';
            doctors.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'doctor-card';
                const photoPath = doc.photo ? doc.photo : `images/doctor${doc.id}.webp`;
                card.innerHTML = `
                    <div class="w-full h-[200px] rounded-xl bg-slate-100 border border-slate-200/80 overflow-hidden flex items-center justify-center flex-shrink-0 shadow-inner relative">
                        <img src="${photoPath}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'flex flex-col items-center justify-center text-slate-400 p-2 text-center\\'><i class=\\'fa-solid fa-user-doctor text-5xl mb-2 text-slate-300\\'></i><span class=\\'text-xs font-semibold\\'>사진 준비중</span></div>';" class="w-full h-full object-cover object-top scale-105 origin-top -translate-y-4">
                    </div>
                    <div class="mt-2 mb-1 px-0.5 flex items-center justify-center gap-1 whitespace-nowrap overflow-hidden">
                        <span class="text-[26px] font-black text-slate-900 leading-none tracking-tight flex-shrink-0">${doc.name}</span>
                        <span class="text-[12px] font-black text-blue-900 bg-blue-100 px-1 py-0.5 rounded border border-blue-200/80 leading-tight flex-shrink-0">${doc.title}</span>
                        <span class="text-[12px] font-bold text-slate-700 leading-none tracking-tighter truncate">| ${doc.dept}</span>
                    </div>
                    <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-200/80 flex-grow flex flex-col justify-center w-full">
                        <table class="w-full h-full text-center border-collapse">
                            <thead><tr class="border-b-2 border-slate-200/80"><th class="pb-1 text-xs text-slate-500 font-extrabold w-8">구분</th>${days.map(d => `<th class="pb-1 text-base font-black text-slate-800 ${d.key==='sun'?'text-rose-600':''}">${d.label}</th>`).join('')}</tr></thead>
                            <tbody class="divide-y divide-slate-200/60">
                                <tr><td class="py-1.5 text-xs text-slate-700 font-black bg-slate-200/70 rounded">오전</td>${days.map(d => `<td class="py-1.5">${renderStatusBadge(doc.schedule[d.key]?doc.schedule[d.key][0]:'휴진')}</td>`).join('')}</tr>
                                <tr><td class="py-1.5 text-xs text-slate-700 font-black bg-slate-200/70 rounded">오후</td>${days.map(d => `<td class="py-1.5">${renderStatusBadge(doc.schedule[d.key]?doc.schedule[d.key][1]:'휴진')}</td>`).join('')}</tr>
                            </tbody>
                        </table>
                    </div>`;
                main.appendChild(card);
            });
        }

        function openModal() {
            const list = document.getElementById('modalDoctorList');
            list.innerHTML = '';
            doctors.forEach((doc, idx) => {
                const item = document.createElement('div');
                item.className = "bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3";
                item.innerHTML = `
                    <div class="flex items-center gap-4 flex-wrap pb-2 border-b border-slate-200">
                        <span class="bg-blue-900 text-white text-xs font-bold px-2.5 py-1 rounded">의사 ${idx + 1}</span>
                        <div class="flex items-center gap-2"><label class="text-xs font-bold text-slate-600">성함:</label><input type="text" id="doc_name_${idx}" value="${doc.name}" class="border border-slate-300 rounded px-2.5 py-1 text-sm font-bold w-28 focus:outline-blue-600"></div>
                        <div class="flex items-center gap-2"><label class="text-xs font-bold text-slate-600">직책:</label><input type="text" id="doc_title_${idx}" value="${doc.title}" class="border border-slate-300 rounded px-2.5 py-1 text-sm font-bold w-28 focus:outline-blue-600"></div>
                        <div class="flex items-center gap-2 flex-grow"><label class="text-xs font-bold text-slate-600">진료과목:</label><input type="text" id="doc_dept_${idx}" value="${doc.dept}" class="border border-slate-300 rounded px-2.5 py-1 text-sm font-bold w-full focus:outline-blue-600"></div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-center border-collapse">
                            <thead><tr class="bg-slate-200/70 text-slate-700"><th class="p-1.5">시간</th>${days.map(d => `<th class="p-1.5 ${d.key==='sun'?'text-rose-600 font-bold':''}">${d.label}요일</th>`).join('')}</tr></thead>
                            <tbody>
                                <tr><td class="font-bold text-slate-600 p-1.5">오전</td>${days.map(d => `<td class="p-1"><select id="sel_${idx}_${d.key}_0" class="border rounded p-1 text-xs w-full bg-white"><option value="진료" ${(doc.schedule[d.key]&&normalizeStatus(doc.schedule[d.key][0])==='진료')?'selected':''}>● 진료</option><option value="야간" ${(doc.schedule[d.key]&&normalizeStatus(doc.schedule[d.key][0])==='야간')?'selected':''}>★ 야간</option><option value="부분" ${(doc.schedule[d.key]&&normalizeStatus(doc.schedule[d.key][0])==='부분')?'selected':''}>▲ 부분</option><option value="휴진" ${(!doc.schedule[d.key]||normalizeStatus(doc.schedule[d.key][0])==='휴진')?'selected':''}>- 휴진</option></select></td>`).join('')}</tr>
                                <tr><td class="font-bold text-slate-600 p-1.5">오후</td>${days.map(d => `<td class="p-1"><select id="sel_${idx}_${d.key}_1" class="border rounded p-1 text-xs w-full bg-white"><option value="진료" ${(doc.schedule[d.key]&&normalizeStatus(doc.schedule[d.key][1])==='진료')?'selected':''}>● 진료</option><option value="야간" ${(doc.schedule[d.key]&&normalizeStatus(doc.schedule[d.key][1])==='야간')?'selected':''}>★ 야간</option><option value="부분" ${(doc.schedule[d.key]&&normalizeStatus(doc.schedule[d.key][1])==='부분')?'selected':''}>▲ 부분</option><option value="휴진" ${(!doc.schedule[d.key]||normalizeStatus(doc.schedule[d.key][1])==='휴진')?'selected':''}>- 휴진</option></select></td>`).join('')}</tr>
                            </tbody>
                        </table>
                    </div>`;
                list.appendChild(item);
            });
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('editModal').classList.add('hidden'); }

        function saveChanges() {
            doctors.forEach((doc, idx) => {
                doc.name = document.getElementById(`doc_name_${idx}`).value; doc.title = document.getElementById(`doc_title_${idx}`).value; doc.dept = document.getElementById(`doc_dept_${idx}`).value;
                if (!doc.schedule) doc.schedule = {};
                days.forEach(d => { doc.schedule[d.key] = [document.getElementById(`sel_${idx}_${d.key}_0`).value, document.getElementById(`sel_${idx}_${d.key}_1`).value]; });
            });
            try { localStorage.setItem('jaseng_did_doctors_v14', JSON.stringify(doctors)); } catch(e) {}
            renderDID(); closeModal();
        }

        function showResetConfirm() { document.getElementById('resetConfirmModal').classList.remove('hidden'); }
        function closeResetConfirm() { document.getElementById('resetConfirmModal').classList.add('hidden'); }
        function executeResetDefaults() { doctors = JSON.parse(JSON.stringify(defaultDoctors)); try { localStorage.removeItem('jaseng_did_doctors_v14'); } catch(e) {} renderDID(); closeResetConfirm(); closeModal(); }

        function exportToCSV() {
            let csv = '\uFEFFID,성함,직책,진료과목,사진경로,월_오전,월_오후,화_오전,화_오후,수_오전,수_오후,목_오전,목_오후,금_오전,금_오후,토_오전,토_오후,일_오전,일_오후\n';
            doctors.forEach(doc => {
                csv += [doc.id, `"${doc.name}"`, `"${doc.title}"`, `"${doc.dept}"`, `"${doc.photo||''}"`,
                    normalizeStatus(doc.schedule.mon?.[0]), normalizeStatus(doc.schedule.mon?.[1]), normalizeStatus(doc.schedule.tue?.[0]), normalizeStatus(doc.schedule.tue?.[1]), normalizeStatus(doc.schedule.wed?.[0]), normalizeStatus(doc.schedule.wed?.[1]),
                    normalizeStatus(doc.schedule.thu?.[0]), normalizeStatus(doc.schedule.thu?.[1]), normalizeStatus(doc.schedule.fri?.[0]), normalizeStatus(doc.schedule.fri?.[1]), normalizeStatus(doc.schedule.sat?.[0]), normalizeStatus(doc.schedule.sat?.[1]),
                    normalizeStatus(doc.schedule.sun?.[0]), normalizeStatus(doc.schedule.sun?.[1])
                ].join(",") + "\n";
            });
            const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); link.download = "schedule.csv"; document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function importFromCSV(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) { if (parseAndApplyCSV(event.target.result)) { renderDID(); openModal(); alert("적용 완료!"); } e.target.value = ''; };
            reader.readAsText(file, 'UTF-8');
        }

        let titleClickCount = 0, titleClickTimer = null;
        function handleSecretTitleClick() { titleClickCount++; clearTimeout(titleClickTimer); if (titleClickCount >= 5) { openModal(); titleClickCount = 0; } else { titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 1500); } }
        window.addEventListener('keydown', e => { if (e.key === 'F10') { e.preventDefault(); openModal(); } });

        function adjustScale() {
            const canvas = document.getElementById('did-canvas');
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            if (window.innerWidth < 1920 || window.innerHeight < 1080) { canvas.style.transform = `scale(${scale})`; canvas.style.transformOrigin = 'center center'; } 
            else { canvas.style.transform = 'none'; }
        }

        window.addEventListener('resize', adjustScale);

        // ⭐ 핵심 2: 10분(600000ms)마다 TV 화면 자체를 캐시 없이 무조건 강제 새로고침
        setTimeout(() => {
            window.location.href = window.location.pathname + '?reload=' + new Date().getTime();
        }, 10 * 60 * 1000);

        window.onload = function() { initData(); adjustScale(); };
    </script>
</body>
